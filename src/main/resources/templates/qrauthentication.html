<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Security Access</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/login.css}">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        .qr-card {
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 24px;
            padding: 40px 30px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            text-align: center;
            max-width: 400px;
            width: 90%;
            margin: auto;
        }
        .qr-frame {
            background: #ffffff;
            padding: 16px;
            border-radius: 16px;
            display: inline-block;
            margin: 25px auto;
        }
        .loading-dots {
            font-size: 14px;
            color: #38bdf8;
            margin-top: 10px;
            font-weight: 500;
        }
    </style>
</head>
<body>

<div id="stars"></div>
<div class="container" style="display: flex; justify-content: center; align-items: center; min-height: 100vh;">
    <div class="qr-card">
        <h2 style="color:#fff; font-size:24px; font-weight:600;">QR Authentication</h2>
        <p style="color:#94a3b8; font-size:14px; margin-top: 4px;">Scan with your verified smartphone</p>

        <div class="qr-frame">
            <div id="qrcode"></div>
        </div>

        <div class="loading-dots" id="statusMessage">
            <i class="fa-solid fa-circle-notch fa-spin"></i> Awaiting scan...
        </div>

        <a th:href="@{/login}" style="display:inline-block; margin-top:25px; color:#64748b; text-decoration:none; font-size:13px;">
            <i class="fa-solid fa-arrow-left"></i> Return to Login
        </a>
    </div>
</div>

<script th:inline="javascript">
    const qrTokenString = /*[[${qrToken}]]*/ 'test-token';
    
    // FIX: Forced NGROK domain so the QR code works even if you test on localhost
    const publicDomain = "https://chase-coat-cover.ngrok-free.dev"; 
    const accessTargetUrl = `${publicDomain}/scan-qr?token=${qrTokenString}`;

    new QRCode(document.getElementById("qrcode"), {
        text: accessTargetUrl,
        width: 200, height: 200,
        colorDark : "#020617", colorLight : "#ffffff",
        correctLevel : QRCode.CorrectLevel.H
    });

    const statusMsg = document.getElementById("statusMessage");

    const pollInterval = setInterval(() => {
        fetch('/qr-check-status')
            .then(response => response.json())
            .then(data => {
                const status = data.status; 
                
                if (status === "APPROVED") {
                    clearInterval(pollInterval);
                    window.location.href = "/dashboard";
                } 
                else if (status === "WAITING_FOR_EMAIL_APPROVAL") {
                    statusMsg.innerHTML = '<i class="fa-solid fa-envelope"></i> Scan confirmed! Check email to approve.';
                    statusMsg.style.color = "#4ade80"; // Green
                }
                else if (status === "EXPIRED") {
                    clearInterval(pollInterval);
                    statusMsg.innerHTML = '<i class="fa-solid fa-circle-xmark"></i> Expired. Refresh page.';
                    statusMsg.style.color = "#fca5a5"; // Red
                }
            })
            .catch(err => console.error(err));
    }, 2000);
</script>
<script th:src="@{/js/login.js}"></script>
</body>
</html>
