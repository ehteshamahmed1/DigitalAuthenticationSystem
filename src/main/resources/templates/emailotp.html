<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTP Verification - Digital Authentication System</title>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- Stylesheet -->
    <link rel="stylesheet" th:href="@{/css/login.css}">

    <style>
        .otp-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 35px 30px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            text-align: center;
            max-width: 420px;
            width: 90%;
            margin: auto;
        }

        .otp-icon {
            font-size: 48px;
            color: #00d2ff;
            margin-bottom: 15px;
            text-shadow: 0 0 15px rgba(0, 210, 255, 0.4);
        }

        .otp-input {
            letter-spacing: 12px;
            font-size: 24px;
            font-weight: 700;
            text-align: center;
            background: rgba(255, 255, 255, 0.08) !important;
            border: 1px solid rgba(255, 255, 255, 0.2) !important;
            color: #fff !important;
            padding: 12px !important;
            border-radius: 10px !important;
            margin: 20px 0 !important;
            width: 100%;
            box-sizing: border-box;
        }

        .otp-input:focus {
            border-color: #00d2ff !important;
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.5);
            outline: none;
        }

        .timer-text {
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
            margin-top: 15px;
        }

        .resend-link {
            color: #00d2ff;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s;
        }

        .resend-link.disabled {
            pointer-events: none;
            opacity: 0.4;
            color: #888;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: rgba(255, 255, 255, 0.6);
            text-decoration: none;
            font-size: 13px;
            transition: color 0.3s;
        }

        .back-link:hover {
            color: #fff;
        }
    </style>
</head>

<body>

<div id="stars">
    <div class="star" style="left:8%;animation-duration:18s;"></div>
    <div class="star" style="left:18%;animation-duration:22s;"></div>
    <div class="star" style="left:28%;animation-duration:20s;"></div>
    <div class="star" style="left:40%;animation-duration:25s;"></div>
    <div class="star" style="left:55%;animation-duration:19s;"></div>
    <div class="star" style="left:70%;animation-duration:21s;"></div>
    <div class="star" style="left:82%;animation-duration:24s;"></div>
    <div class="star" style="left:94%;animation-duration:20s;"></div>
</div>

<div class="container" style="display: flex; justify-content: center; align-items: center; min-height: 100vh;">

    <div class="otp-card">

        <div class="otp-icon">
            <i class="fa-solid fa-envelope-circle-check"></i>
        </div>

        <h2 style="color:#fff; margin-bottom:8px; font-weight:600;">Email OTP Verification</h2>

        <p style="color:rgba(255,255,255,0.7); font-size:14px; line-height:1.4;">
            We've sent a 6-digit verification code to<br>
            <strong style="color:#00d2ff;" th:text="${email}">user@example.com</strong>
        </p>

        <!-- Status Alerts -->
        <div th:if="${success}" style="color: #00ff99; margin-top: 15px; font-size: 14px; font-weight: 500;" th:text="${success}"></div>
        <div th:if="${error}" style="color: #ff4d4d; margin-top: 15px; font-size: 14px; font-weight: 500;" th:text="${error}"></div>

        <form th:action="@{/verifyOtp}" method="post">
            <!-- CSRF Token -->
            <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <input type="hidden" name="email" th:value="${email}">

            <input type="text"
                   name="otp"
                   class="otp-input"
                   maxlength="6"
                   pattern="[0-9]{6}"
                   placeholder="******"
                   autocomplete="off"
                   required
                   autofocus>

            <button type="submit" class="primary" style="width:100%; padding: 12px; border-radius: 10px; font-weight:600; cursor:pointer;">
                Verify & Proceed
            </button>
        </form>

        <div class="timer-text">
            <span id="timerText">Resend OTP in <strong id="secondsCount">60</strong>s</span>
        </div>

        <div style="margin-top: 10px;">
            <a id="resendBtn" th:href="@{/resendOtp(email=${email})}" class="resend-link disabled">
                <i class="fa-solid fa-rotate-right"></i> Resend OTP Code
            </a>
        </div>

        <a th:href="@{/login}" class="back-link">
            <i class="fa-solid fa-arrow-left"></i> Return to Login
        </a>

    </div>

</div>

<script>
    let seconds = 60;
    const secondsCount = document.getElementById("secondsCount");
    const timerText = document.getElementById("timerText");
    const resendBtn = document.getElementById("resendBtn");

    const countdown = setInterval(function() {
        seconds--;
        if (secondsCount) secondsCount.innerText = seconds;

        if (seconds <= 0) {
            clearInterval(countdown);
            timerText.innerHTML = "Didn't receive code?";
            resendBtn.classList.remove("disabled");
        }
    }, 1000);
</script>

</body>
</html>
