<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Puzzle Security - Digital Authentication System</title>
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cloudflare.com">
    
    <!-- Premium Login Theme Stylesheet -->
    <link rel="stylesheet" th:href="@{/css/login.css}">
    
    <style>
        .puzzle-card {
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 24px;
            padding: 35px 25px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 35px rgba(0, 183, 255, 0.15);
            text-align: center;
            max-width: 380px;
            width: 90%;
            margin: auto;
            animation: panelFade 0.5s ease-out;
        }

        /* 3x3 Puzzle Interactive Grid layout structure */
        .puzzle-grid {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            grid-template-rows: repeat(3, 100px);
            gap: 3px;
            width: 306px;
            height: 306px;
            margin: 25px auto;
            background: rgba(2, 6, 23, 0.4);
            border-radius: 12px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            overflow: hidden;
            padding: 2px;
        }

        /* Individual unarranged slice blocks */
        .puzzle-tile {
            width: 100px;
            height: 100px;
            background-repeat: no-repeat;
            border-radius: 6px;
            cursor: grab;
            box-shadow: inset 0 0 4px rgba(0,0,0,0.5);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .puzzle-tile:active {
            cursor: grabbing;
            transform: scale(0.96);
            box-shadow: 0 4px 12px rgba(0, 153, 255, 0.4);
        }
    </style>
</head>
<body>

<!-- Background animations synced with your layout theme -->
<div id="stars">
    <div class="star" style="left:5%;animation-duration:20s;"></div>
    <div class="star" style="left:45%;animation-duration:15s;"></div>
    <div class="star" style="left:80%;animation-duration:22s;"></div>
</div>
<div id="mouse-light"></div>

<div class="container" style="display: flex; justify-content: center; align-items: center; min-height: 100vh;">
    <div class="puzzle-card">
        <h2 style="color:#fff; font-size:22px; font-weight:600;">Image Verification</h2>
        <p style="color:#94a3b8; font-size:13px; margin-top: 4px;">Drag and swap tiles to rearrange the image correctly</p>

        <!-- Error display alert if the submission fails -->
        <div th:if="${error}" class="alert alert-danger" style="margin-top:15px; color:#fca5a5; font-size:13px;" th:text="${error}"></div>

        <!-- Master Interactive Grid containing the tile slices -->
        <div class="puzzle-grid" id="puzzleGrid">
            <!-- Iterates over the scrambled sequence generated by your server -->
            <div th:each="posIndex : ${sequence}" 
                 class="puzzle-tile" 
                 draggable="true"
                 th:data-correct-id="${posIndex}"
                 th:id="'tile-' + ${posIndex}">
            </div>
        </div>

        <button type="button" class="primary" onclick="submitPuzzleSolution()">Verify & Authenticate</button>

        <!-- Hidden token payload configuration routing framework tracking lines link -->
        <form id="puzzleSubmitForm" th:action="@{/verifyPuzzle}" method="post">
            <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <input type="hidden" id="puzzleSolution" name="puzzleSolution" value="">
        </form>
    </div>
</div>

<script th:inline="javascript">
    // FIX: Set the file name string matching your functional localhost resource endpoint directly!
    const imageUrl = /*[[@{/images/3cats.png}]]*/ '/images/3cats.png';

    document.addEventListener("DOMContentLoaded", () => {
        const tiles = document.querySelectorAll('.puzzle-tile');
        
        tiles.forEach(tile => {
            const correctId = parseInt(tile.getAttribute('data-correct-id'));
            
            // Calculate precise 3x3 block slice dimensions
            const row = Math.floor(correctId / 3);
            const col = correctId % 3;
            
            // Map the background and scale it down to exactly fit the board bounds window container
            tile.style.backgroundImage = `url('${imageUrl}')`;
            tile.style.backgroundSize = "306px 306px"; 
            tile.style.backgroundPosition = `-${col * 100}px -${row * 100}px`;
            
            // Register interaction handlers for web view clients
            tile.addEventListener('dragstart', handleDragStart);
            tile.addEventListener('dragover', handleDragOver);
            tile.addEventListener('drop', handleDrop);
        });
    });

    let draggedElement = null;

    function handleDragStart(e) {
        draggedElement = this;
        e.dataTransfer.setData('text/plain', this.id);
    }

    function handleDragOver(e) {
        e.preventDefault(); 
    }

    function handleDrop(e) {
        e.preventDefault();
        if (this === draggedElement) return;

        // Perform clean swap of visuals and properties between grid items
        const activeBg = this.style.backgroundImage;
        const activeSize = this.style.backgroundSize; 
        const activePos = this.style.backgroundPosition;
        const activeId = this.getAttribute('data-correct-id');

        this.style.backgroundImage = draggedElement.style.backgroundImage;
        this.style.backgroundSize = draggedElement.style.backgroundSize;
        this.style.backgroundPosition = draggedElement.style.backgroundPosition;
        this.setAttribute('data-correct-id', draggedElement.getAttribute('data-correct-id'));

        draggedElement.style.backgroundImage = activeBg;
        draggedElement.style.backgroundSize = activeSize;
        draggedElement.style.backgroundPosition = activePos;
        draggedElement.setAttribute('data-correct-id', activeId);
    }

    function submitPuzzleSolution() {
        const tiles = document.getElementById('puzzleGrid').children;
        let currentLayoutArr = [];
        
        // Assemble current state layout arrays sequence context matrix strings maps paths
        for(let i = 0; i < tiles.length; i++) {
            currentLayoutArr.push(tiles[i].getAttribute('data-correct-id'));
        }

        document.getElementById('puzzleSolution').value = currentLayoutArr.join(',');
        document.getElementById('puzzleSubmitForm').submit();
    }
</script>

<!-- Shared core cursor glow elements trackers engine link -->
<script th:src="@{/js/login.js}"></script>
</body>
</html>
